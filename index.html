<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Biblioteca - Magia de Honnoir</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <section id="library-screen" class="screen">
            <h1>Biblioteca</h1>
            <div id="book-list" class="book-list">Carregando...</div>
            <!-- Upload removido: adicione livros diretamente em books/ no repositório -->

        <section id="reader-screen" class="screen hidden">
            <button id="back">← Voltar à Biblioteca</button>
            <article id="book-view" class="book-view"></article>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
